# ─────────────────────────────────────────────────────────────────────────────
# Add this service to your existing docker-compose.yml on the BookStack server.
#
# Image: volkerhaensel/bookstack-mcp-remote:latest (Docker Hub)
#
# Assumes bookstack-mcp runs in the same docker-compose as bookstack.
# bookstack-mcp reaches bookstack directly via the internal Docker network
# (http://bookstack:80) instead of going through the public URL.
#
# Required env vars:
#   BOOKSTACK_API_TOKEN  – token_id:token_secret  (same as used for Claude Desktop)
#   JWT_SECRET           – generate with: openssl rand -base64 32
#   BASE_URL             – public HTTPS URL of this service
# ─────────────────────────────────────────────────────────────────────────────

services:
  bookstack-mcp:
    image: volkerhaensel/bookstack-mcp-remote:latest
    container_name: bookstack-mcp
    environment:
      - BOOKSTACK_BASE_URL=http://bookstack:80/api
      - BOOKSTACK_API_TOKEN=<token_id>:<token_secret>
      - JWT_SECRET=<generate: openssl rand -base64 32>
      - BASE_URL=https://mcp-bookstack.01640.link
      - MCP_PORT=3100
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    depends_on:
      - bookstack
